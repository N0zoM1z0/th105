schema_version = 1

# This is a repository taxonomy, not recovered original translation-unit
# ownership. Every module boundary remains provisional for 1.06a.
[modules.platform]
status = "proposed"
description = "Win32 process/window/timing/bootstrap and static runtime integration"

[modules.engine]
status = "proposed"
description = "Main loop, scene lifetime, transitions, and shared services"

[modules.input]
status = "proposed"
description = "Physical devices and logical player/menu input"

[modules.render]
status = "proposed"
description = "Direct3D rendering, sprites, animation, and frame/pattern data"

[modules.assets]
status = "proposed"
description = "Packages, textures, patterns, and resource lookup"

[modules.audio]
status = "proposed"
description = "Music and sound playback"

[modules.ui]
status = "proposed"
description = "Menus, profiles, configuration, selection, and HUD"

[modules.script]
status = "proposed"
description = "Scenario and command parsing/dispatch"

[modules.network]
status = "proposed"
description = "Client/server/watch modes and packet transport"

[modules.battle]
status = "proposed"
description = "Battle state, collision, weather, effects, and fighter interaction"

[modules.characters]
status = "proposed"
description = "Per-fighter behavior and owned object families"

[modules.third_party]
status = "proposed"
description = "Compiler runtime and independently identified linked libraries"
