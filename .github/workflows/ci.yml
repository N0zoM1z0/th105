name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -r scripts/requirements-ci.txt
      - run: scripts/repo-python scripts/ci.py
