name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Basic checks
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$CHECK_BASE" && "$CHECK_BASE" != 0000000000000000000000000000000000000000 ]]; then
            python3 scripts/ci.py --base "$CHECK_BASE"
          else
            python3 scripts/ci.py
          fi
